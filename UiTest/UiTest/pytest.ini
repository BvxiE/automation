[pytest]
addopts = -v --reruns 2 --reruns-delay 1 --alluredir=./report/tmps --clean-alluredir
log_file = ./log/result.log
log_file_level = info
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
testpaths = tests
;python_files=a_*.py *_aa.py#修改模块名
;python_classes=B_*#修改类名
;python_functions=c_* #修改方法/函数
markers =
    smoke: 冒烟测试
    ui:ui自动化
    ut:单元测试
    api:接口自动化
    ddt:数据驱动